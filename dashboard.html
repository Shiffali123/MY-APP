<!DOCTYPE html>
<html>
<head>
    <title>DohAssist Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>DohAssist Reconciliation Dashboard</h1>
    <button onclick="logout()" class="logout">Logout</button>
</header>

<div class="container">

    <div class="sidebar">
        <button onclick="showSection('upload')">Upload Reports</button>
        <button onclick="showSection('summary')">Reconciliation Summary</button>
        <button onclick="showSection('alerts')">Alerts</button>
    </div>

    <div class="content">

        <div id="upload" class="section">
            <h2>Upload Store Reports</h2>
            <input type="file" id="fileUpload">
            <button onclick="uploadFile()">Upload</button>
            <p id="uploadStatus"></p>
        </div>

        <div id="summary" class="section hidden">
            <h2>Store Summary</h2>
            <p>Total Sales: $<span id="sales">0</span></p>
            <p>Total Purchases: $<span id="purchases">0</span></p>
            <p>Gross Profit: <span id="profit">0%</span></p>
        </div>

        <div id="alerts" class="section hidden">
            <h2>System Alerts</h2>
            <ul id="alertList"></ul>
        </div>

    </div>

</div>

<script src="script.js"></script>
</body>
</html>
